services:
  - type: web
    name: sages-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://sages-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sagesgestionpatremoines.vercel.app
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: sages-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sages-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sages-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sages-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sages-db
          property: password
      - key: DB_SSLMODE
        value: require

databases:
  - name: sages-db
    databaseName: sages
    user: sages
    plan: free
